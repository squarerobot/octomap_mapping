# This config uses industrial_ci (https://github.com/ros-industrial/industrial_ci.git).
# For troubleshooting, see readme (https://github.com/ros-industrial/industrial_ci/blob/master/README.rst)

name: CI

# This determines when this workflow is run
on: [push, pull_request] # on all pushes and PRs

jobs:
  CI:
    strategy:
      # keep the other distros building when one leg fails
      fail-fast: false
      matrix:
        env:
          # PRERELEASE legs removed: industrial_ci refuses prerelease tests
          # for EOL distros (melodic and noetic both are), failing instantly
          - {ROS_DISTRO: melodic}
          - {ROS_DISTRO: noetic}
          - {ROS_DISTRO: noetic, OS_NAME: debian, OS_CODE_NAME: buster}
    env:
      CCACHE_DIR: /github/home/.ccache # Enable ccache
      PARALLEL_BUILDS: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This step will fetch/store the directory used by ccache before/after the ci run
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.env.ROS_DISTRO }}-${{ matrix.env.ROS_REPO }}
      # Run industrial_ci
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{ matrix.env }}
