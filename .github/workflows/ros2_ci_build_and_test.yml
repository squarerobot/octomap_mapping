name: ROS2 CI

on:
  pull_request:
    branches:
      - 'ros2'

jobs:
  test_environment:
    strategy:
      fail-fast: false
      matrix:
        # SR3B targets jazzy; kilted kept as the forward-compat check.
        # humble fails only on uncrustify version skew and rolling lacks
        # released octomap_msgs; both can return when they become targets.
        ros_distribution:
          - jazzy
          - kilted
        include:
          # Jazzy Jalisco (May 2024 - May 2029)
          - docker_image: ghcr.io/sloretz/ros:jazzy-ros-base
            ros_distribution: jazzy
            ros_version: 2
          # Kilted Kaiju (May 2025 - December 2026)
          - docker_image: ghcr.io/sloretz/ros:kilted-ros-base
            ros_distribution: kilted
            ros_version: 2
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.docker_image }}
    continue-on-error: ${{ matrix.ros_distribution == 'rolling' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Search packages in this repository
        id: list_packages
        run: |
          echo ::set-output name=package_list::$(colcon list --names-only)

      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: ${{ steps.list_packages.outputs.package_list }}
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: build_depends.repos
          coverage-result: false
