name: Industrial-CI
on: [push, pull_request] # on all pushes and PRs

jobs:
  CI:
    strategy:
      # SR3B targets jazzy; kilted kept as the forward-compat check.
      # humble (uncrustify version skew) and rolling (octomap_msgs not
      # released there) can return when they become targets.
      fail-fast: false
      matrix:
        env:
          # UPSTREAM_WORKSPACE builds octomap_ros from source per
          # build_depends.repos; it has no released deb on these distros
          - {ROS_DISTRO: jazzy, UPSTREAM_WORKSPACE: build_depends.repos}
          - {ROS_DISTRO: kilted, UPSTREAM_WORKSPACE: build_depends.repos}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{ matrix.env }}
